# ───────────────────────────────────────────────────────────────────────────────
# Environnement de DÉVELOPPEMENT
# Lance uniquement PostgreSQL + Adminer.
# Les services Spring Boot (game-api, game-server) tournent en local :
#   cd game-api        && ./gradlew bootRun
#   cd game-server-java && ./gradlew bootRun
# Le frontend Angular :
#   cd game-web         && ng serve
# ───────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: toonlive-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-toonlive}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-toonlive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4-standalone
    container_name: toonlive-dev-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark

volumes:
  postgres_dev_data:
    name: toonlive-dev-postgres-data
