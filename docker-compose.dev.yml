# ───────────────────────────────────────────────────────────────────────────────
# Environnement de DÉVELOPPEMENT
# Lance uniquement PostgreSQL + Adminer + game-assets.
# Les services Spring Boot (game-api, game-server) tournent en local :
#   cd game-api        && ./gradlew bootRun
#   cd game-server-java && ./gradlew bootRun
# Le frontend Angular :
#   cd game-web         && ng serve
# Le serveur d'assets :
#   docker compose -f docker-compose.dev.yml up game-assets
# ───────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: toonlive-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-toonlive}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-toonlive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4-standalone
    container_name: toonlive-dev-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark

  # Serveur d'assets dynamiques (port 3001) — assets montés en volume local
  game-assets:
    build:
      context: ./game-assets
      dockerfile: Dockerfile
    container_name: toonlive-dev-assets
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      PUBLIC_DIR: /usr/share/nginx/html
      UPLOAD_PORT: "3002"
    volumes:
      - ./game-assets/public:/usr/share/nginx/html
    ports:
      - "3001:80"

volumes:
  postgres_dev_data:
    name: toonlive-dev-postgres-data
