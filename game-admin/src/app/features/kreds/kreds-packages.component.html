<p-toast />
<p-confirmDialog />

<div class="page-header">
  <h2>Packs de Kreds</h2>
  <p-button label="Nouveau pack" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<p-table
  [value]="packages()"
  [lazy]="true"
  [paginator]="true"
  [rows]="20"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  (onPage)="onPage($event)"
  styleClass="p-datatable-sm p-datatable-gridlines mt-3"
>
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Nom</th>
      <th>Kreds</th>
      <th>Prix</th>
      <th>Actif</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-pkg>
    <tr>
      <td>{{ pkg.id }}</td>
      <td><strong>{{ pkg.name }}</strong></td>
      <td>
        <p-tag [value]="pkg.kredsAmount + ' K'" severity="info" />
      </td>
      <td>{{ priceEuros(pkg.priceCents) }}</td>
      <td>
        @if (pkg.active) { <p-tag value="Actif" severity="success" /> }
        @else { <p-tag value="Inactif" severity="danger" /> }
      </td>
      <td class="actions-cell">
        <p-button icon="pi pi-pencil" [text]="true" size="small" (onClick)="openEdit(pkg)" />
        <p-button icon="pi pi-trash" severity="danger" [text]="true" size="small" (onClick)="deletePkg(pkg)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- Create/Edit dialog -->
<p-dialog [(visible)]="dialog" [header]="editPkg ? 'Modifier le pack' : 'Nouveau pack'" [modal]="true" [style]="{width:'400px'}">
  <form [formGroup]="form" class="dialog-form">
    <div class="field">
      <label>Nom *</label>
      <input pInputText formControlName="name" placeholder="ex: Pack Starter" class="w-full mt-1" />
    </div>
    <div class="field mt-3">
      <label>Quantité de Kreds *</label>
      <input pInputText type="number" formControlName="kredsAmount" class="w-full mt-1" />
    </div>
    <div class="field mt-3">
      <label>Prix (en centimes) *</label>
      <input pInputText type="number" formControlName="priceCents" class="w-full mt-1" />
      <small class="text-secondary">{{ (form.get('priceCents')?.value ?? 0) / 100 | number:'1.2-2' }} €</small>
    </div>
    <div class="field mt-3 flex align-items-center gap-2">
      <p-inputSwitch formControlName="active" inputId="active" />
      <label for="active">Actif</label>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Annuler" [text]="true" (onClick)="dialog = false" />
    <p-button [label]="editPkg ? 'Modifier' : 'Créer'" (onClick)="save()" [disabled]="form.invalid" />
  </ng-template>
</p-dialog>
