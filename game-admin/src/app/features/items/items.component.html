<p-toast />
<p-confirmDialog />

<div class="page-header">
  <h2>Catalogue d'articles</h2>
  <div class="filters">
    <span class="p-input-icon-left">
      <i class="pi pi-search"></i>
      <input pInputText placeholder="Rechercher..." [(ngModel)]="search" (ngModelChange)="load(0)" />
    </span>
    <p-dropdown [options]="allTypes" [(ngModel)]="typeFilter" optionLabel="label" optionValue="value" (onChange)="load(0)" placeholder="Type" />
    <p-button label="Nouvel article" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>
</div>

<p-table
  [value]="items()"
  [lazy]="true"
  [paginator]="true"
  [rows]="20"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  (onPage)="onPage($event)"
  styleClass="p-datatable-sm p-datatable-gridlines mt-3"
>
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Nom</th>
      <th>Type</th>
      <th>Sous-type</th>
      <th>Possédable</th>
      <th>Image</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-item>
    <tr>
      <td>{{ item.id }}</td>
      <td>{{ item.name }}</td>
      <td><p-tag [value]="item.itemType" severity="info" /></td>
      <td>{{ item.subType }}</td>
      <td>
        @if (item.possessable) { <p-tag value="Oui" severity="success" /> }
        @else { <p-tag value="Non" severity="secondary" /> }
      </td>
      <td class="text-xs mono">{{ item.displayImage }}</td>
      <td class="actions-cell">
        <p-button icon="pi pi-pencil" [text]="true" size="small" (onClick)="openEdit(item)" />
        <p-button icon="pi pi-trash" severity="danger" [text]="true" size="small" (onClick)="deleteItem(item)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- Create/Edit dialog -->
<p-dialog [(visible)]="createDialog" [header]="editItem ? 'Modifier l\'article' : 'Nouvel article'" [modal]="true" [style]="{width:'500px'}">
  <form [formGroup]="form" class="dialog-form">
    <div class="field">
      <label>Nom *</label>
      <input pInputText formControlName="name" class="w-full mt-1" />
    </div>
    <div class="form-row mt-3">
      <div class="field">
        <label>Type *</label>
        <p-dropdown [options]="itemTypes" formControlName="itemType" optionLabel="label" optionValue="value" styleClass="w-full mt-1" />
      </div>
      <div class="field">
        <label>Sous-type *</label>
        <p-dropdown [options]="subTypeOptions()" formControlName="subType" optionLabel="label" optionValue="value" styleClass="w-full mt-1" />
      </div>
    </div>
    <div class="field mt-3">
      <label>Image d'affichage *</label>
      <!-- Rendu tel quel par <img [src]>, sans base prefixée (contrairement à
           spritePath/spriteKey ci-dessous, résolus via AssetBaseUrl côté
           avatar/meuble) — il faut une URL complète, ex. celle de
           game-assets en dev (http://localhost:3001/...). -->
      <input pInputText formControlName="displayImage" placeholder="ex: http://localhost:3001/clothes/tshirt/example.png" class="w-full mt-1" />
    </div>
    @if (isTextureSubType()) {
      <div class="field mt-3">
        <label>Fichier image (avec extension) *</label>
        <!-- PAS un id de spritesheet comme pour le reste du formulaire : une
             image plate (png/jpg), nom complet requis, sans dossier — résolu
             en textures/walls/{spritePath} (WALLPAPER) ou
             textures/floors/{spritePath} (FLOOR), jamais suffixé en .json.
             Contrairement à tout le reste du formulaire, "Clé sprite" n'est
             pas utilisée pour ces deux sous-types (GameCore.applyTexture) —
             inutile de la remplir. -->
        <input pInputText formControlName="spritePath" placeholder="ex: brique_rouge.jpg" class="w-full mt-1" />
      </div>
    } @else {
      <div class="field mt-3">
        <label>Clé sprite (catégorie)</label>
        <!-- = le dossier sous clothes/ ou furnitures/ : hair, hat, tshirt,
             pant, jardin... -->
        <input pInputText formControlName="spriteKey" placeholder="ex: tshirt" class="w-full mt-1" />
      </div>
      <div class="field mt-3">
        <label>Chemin spritesheet (id, sans dossier ni extension)</label>
        <!-- Résolu par le runtime en clothes/{spriteKey}/{spritePath}.json
             (Clothe.ts) ou furnitures/{spriteKey}/{spritePath}.json — jamais
             un chemin complet, malgré ce que suggérait l'ancien placeholder. -->
        <input pInputText formControlName="spritePath" placeholder="ex: tshirt_example" class="w-full mt-1" />
      </div>
    }
    <div class="field mt-3 flex align-items-center gap-2">
      <p-inputSwitch formControlName="possessable" inputId="possessable" />
      <label for="possessable">Possédable</label>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Annuler" [text]="true" (onClick)="createDialog = false" />
    <p-button [label]="editItem ? 'Modifier' : 'Créer'" (onClick)="save()" [disabled]="form.invalid" />
  </ng-template>
</p-dialog>
