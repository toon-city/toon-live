<p-toast />
<h2>Utilisateurs bannis</h2>

<p-table
  [value]="users()"
  [lazy]="true"
  [paginator]="true"
  [rows]="20"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  (onPage)="onPage($event)"
  styleClass="p-datatable-sm p-datatable-gridlines mt-3"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Nom</th>
      <th>Raison</th>
      <th>Banni le</th>
      <th>Par</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-user>
    <tr>
      <td><a [routerLink]="['/users', user.id]" class="user-link">{{ user.username }}</a></td>
      <td>{{ user.banReason }}</td>
      <td>{{ user.bannedAt | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ user.bannedByUsername }}</td>
      <td>
        <p-button icon="pi pi-check-circle" severity="success" [text]="true" size="small" (onClick)="unban(user)" pTooltip="Débannir" />
      </td>
    </tr>
  </ng-template>
</p-table>
